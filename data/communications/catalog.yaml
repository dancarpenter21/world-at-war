devices:
  - id: facility-secure-ip
    display_name: Secure facility IP gateway
    kind: router
    radio_modes: []
    queue_capacity_packets: 8192
    queue_capacity_bytes: 16777216
    processing_delay_ns: 50000
    confidence: estimate
    source_ids: [army-public]
    estimate_rationale: Public facilities are represented by a conservative managed-IP gateway, not a classified architecture.
  - id: facility-satcom
    display_name: Fixed high-bandwidth SATCOM terminal
    kind: satcom
    radio_modes:
      - id: shf-wideband-public-profile
        band: { lower_hz: 7250000000, upper_hz: 8400000000 }
        nominal_bit_rate_bps: 50000000
        max_range_m: 45000000
        shared_medium: true
    queue_capacity_packets: 4096
    queue_capacity_bytes: 8388608
    processing_delay_ns: 200000
    confidence: estimate
    source_ids: [army-public]
    estimate_rationale: Exact terminal variants and service plans are not consistently public; values are scenario-level SHF abstractions.
  - id: link16-air-terminal
    display_name: Public-profile Link 16 terminal
    kind: tactical_data_link
    radio_modes:
      - id: link16-public-profile
        band: { lower_hz: 960000000, upper_hz: 1215000000 }
        nominal_bit_rate_bps: 1000000
        max_range_m: 550000
        shared_medium: true
    queue_capacity_packets: 512
    queue_capacity_bytes: 1048576
    processing_delay_ns: 100000
    confidence: estimate
    source_ids: [dla-mil-std-6016, usaf-fact-sheets]
    estimate_rationale: Membership is publicly reported for these platform classes; rate and range are conservative non-waveform simulation values.
  - id: airborne-satcom
    display_name: Airborne beyond-line-of-sight SATCOM terminal
    kind: satcom
    radio_modes:
      - id: airborne-satcom-public-profile
        band: { lower_hz: 7250000000, upper_hz: 8400000000 }
        nominal_bit_rate_bps: 5000000
        max_range_m: 45000000
        shared_medium: true
    queue_capacity_packets: 1024
    queue_capacity_bytes: 2097152
    processing_delay_ns: 250000
    confidence: estimate
    source_ids: [usaf-fact-sheets]
    estimate_rationale: Exact aircraft terminal modes are variant- and upgrade-dependent.
  - id: naval-multiband-ip
    display_name: Naval multiband IP communications suite
    kind: router
    radio_modes:
      - id: naval-uhf-public-profile
        band: { lower_hz: 225000000, upper_hz: 400000000 }
        nominal_bit_rate_bps: 2000000
        max_range_m: 450000
        shared_medium: true
      - id: naval-satcom-public-profile
        band: { lower_hz: 7250000000, upper_hz: 8400000000 }
        nominal_bit_rate_bps: 20000000
        max_range_m: 45000000
        shared_medium: true
    queue_capacity_packets: 4096
    queue_capacity_bytes: 8388608
    processing_delay_ns: 150000
    confidence: estimate
    source_ids: [navy-fact-files]
    estimate_rationale: The suite aggregates public capabilities without reproducing ship-specific protected configurations.
  - id: ground-tactical-ip
    display_name: Ground tactical IP radio/router
    kind: router
    radio_modes:
      - id: tactical-uhf-public-profile
        band: { lower_hz: 225000000, upper_hz: 450000000 }
        nominal_bit_rate_bps: 2000000
        max_range_m: 80000
        shared_medium: true
    queue_capacity_packets: 1024
    queue_capacity_bytes: 2097152
    processing_delay_ns: 200000
    confidence: estimate
    source_ids: [army-public]
    estimate_rationale: Generic formations lack a single known fit; this is a conservative tactical-network archetype.
  - id: red-generic-terminal
    display_name: Generic opposing-force tactical terminal
    kind: router
    radio_modes:
      - id: opposing-vhf-uhf-estimate
        band: { lower_hz: 100000000, upper_hz: 450000000 }
        nominal_bit_rate_bps: 1000000
        max_range_m: 100000
        shared_medium: true
    queue_capacity_packets: 512
    queue_capacity_bytes: 1048576
    processing_delay_ns: 300000
    confidence: estimate
    source_ids: []
    estimate_rationale: Scenario entities are generic rather than identified variants, so no exact equipment claim is made.

platforms:
  - { id: strategic-facility, display_name: Strategic command facility, device_ids: [facility-secure-ip, facility-satcom] }
  - { id: military-facility, display_name: Military base or operations facility, device_ids: [facility-secure-ip, facility-satcom, ground-tactical-ip] }
  - { id: tactical-aircraft, display_name: Tactical aircraft, device_ids: [link16-air-terminal, airborne-satcom] }
  - { id: airborne-c2, display_name: Airborne C2 or ISR aircraft, device_ids: [link16-air-terminal, airborne-satcom] }
  - { id: naval-major, display_name: Major naval vessel, device_ids: [naval-multiband-ip, link16-air-terminal] }
  - { id: naval-undersea, display_name: Undersea vessel public profile, device_ids: [naval-multiband-ip] }
  - { id: ground-formation, display_name: Ground formation, device_ids: [ground-tactical-ip] }
  - { id: red-generic, display_name: Generic opposing-force platform, device_ids: [red-generic-terminal] }

