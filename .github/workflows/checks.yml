name: Project checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        toolchain: ['1.89.0', stable]
    defaults:
      run:
        working-directory: world-at-war
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: world-at-war
          persist-credentials: false
      - name: Prepare pinned c3mesh (Linux)
        if: runner.os != 'Windows'
        run: sh scripts/setup-c3mesh.sh
      - name: Prepare pinned c3mesh (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-c3mesh.ps1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: world-at-war
          shared-key: world-rust-${{ matrix.toolchain }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  browser:
    name: Web build and real gameplay
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: world-at-war/web
    env:
      SPACETRACK_E2E_USERNAME: ''
      SPACETRACK_E2E_PASSWORD: ''
      SPACETRACK_USERNAME: ''
      SPACETRACK_PASSWORD: ''
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: world-at-war
          persist-credentials: false
      - name: Prepare pinned c3mesh
        working-directory: world-at-war
        run: sh scripts/setup-c3mesh.sh
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.89.0'
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: world-at-war
          shared-key: world-rust-1.89.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: world-at-war/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --reporter=line,html
      - name: Save browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-diagnostics
          path: |
            world-at-war/web/test-results/
            world-at-war/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
